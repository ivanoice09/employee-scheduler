spring:
  application:
    name: employee-scheduler
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

# this config applies both on dev and prod
app:
  demo:
    session-ttl-minutes: 30
    cleanup-enabled: false
    cleanup-cron: "0 0 3 * * *"
  cookie:
    secure: true

---
spring:
  config:
    activate:
      on-profile: dev

# override session-ttl-minutes and make it less duration on local dev
app:
  demo:
    session-ttl-minutes: 5

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT}
  ssl:
    enabled: true
    certificate: file:certs/localhost.pem
    certificate-private-key: file:certs/localhost-key.pem

#jwt:
#  secret: ${JWT_SECRET}

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

#jwt:
#  secret: ${JWT_SECRET}

